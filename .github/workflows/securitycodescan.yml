# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates SecurityCodeScan with GitHub's Code Scanning feature
# SecurityCodeScan is a vulnerability patterns detector for C# and VB.NET

name: SecurityCodeScan

on:
  push:
    branches: [ "dev" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "dev" ]
  schedule:
    - cron: '22 14 * * 0'

permissions:
  contents: read

jobs:
  SCS:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # 生成仓库根的 Directory.Build.props，为所有项目接入 SecurityCodeScan 分析器并输出 SARIF
      - name: Set up projects for analysis
        shell: bash
        run: |
          cat > Directory.Build.props <<'EOF'
          <Project>
            <PropertyGroup>
              <ErrorLog>analysis.sarif</ErrorLog>
              <AdditionalFileItemNames>$(AdditionalFileItemNames);Content</AdditionalFileItemNames>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="SecurityCodeScan.VS2019" Version="5.6.7" PrivateAssets="all" IncludeAssets="runtime; build; native; contentfiles; analyzers; buildtransitive" />
            </ItemGroup>
          </Project>
          EOF

      - name: Restore dependencies
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: Build
        run: dotnet build framework/XiHan.Framework.slnx -c Release --no-restore -p:GeneratePackageOnBuild=false

      # Sarif.Multitool 2.3.10 以 .NET Core 3.1 为目标，允许其前滚到 runner 上的新版运行时
      - name: Convert sarif for uploading to GitHub
        uses: security-code-scan/security-code-scan-results-action@cdb3d5e639054395e45bf401cba8688fcaf7a687
        env:
          DOTNET_ROLL_FORWARD: Major

      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@v3
