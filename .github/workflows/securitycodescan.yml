# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow integrates SecurityCodeScan with GitHub's Code Scanning feature
# SecurityCodeScan is a vulnerability patterns detector for C# and VB.NET

name: SecurityCodeScan

on:
  push:
    branches: [ "dev" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "dev" ]
  schedule:
    - cron: '22 14 * * 0'

permissions:
  contents: read

jobs:
  SCS:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # 生成仓库根的 Directory.Build.props，为所有项目接入 SecurityCodeScan 分析器并输出 SARIF
      - name: Set up projects for analysis
        shell: bash
        run: |
          cat > Directory.Build.props <<'EOF'
          <Project>
            <PropertyGroup>
              <ErrorLog>analysis.sarif,version=2.1</ErrorLog>
              <AdditionalFileItemNames>$(AdditionalFileItemNames);Content</AdditionalFileItemNames>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="SecurityCodeScan.VS2019" Version="5.6.7" PrivateAssets="all" IncludeAssets="runtime; build; native; contentfiles; analyzers; buildtransitive" />
            </ItemGroup>
          </Project>
          EOF

      - name: Restore dependencies
        run: dotnet restore framework/XiHan.Framework.slnx

      - name: Build
        run: dotnet build framework/XiHan.Framework.slnx -c Release --no-restore -p:GeneratePackageOnBuild=false

      # 合并各项目的 SARIF，只保留 SCS 规则与结果，输出为单个 run
      - name: Merge sarif
        shell: bash
        run: |
          mkdir -p scs-results
          find framework -name analysis.sarif -print0 | xargs -0 jq -s '{
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            version: "2.1.0",
            runs: [{
              tool: { driver: {
                name: "SecurityCodeScan",
                informationUri: "https://security-code-scan.github.io",
                rules: ([.[].runs[].tool.driver.rules // [] | .[] | select(.id | startswith("SCS"))] | unique_by(.id))
              } },
              results: [.[].runs[].results // [] | .[] | select(.ruleId | startswith("SCS")) | del(.ruleIndex)]
            }]
          }' > scs-results/scs.sarif
          jq '.runs[0].results | length' scs-results/scs.sarif

      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scs-results/scs.sarif
          category: securitycodescan
